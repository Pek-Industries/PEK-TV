import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

kotlin {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_17)
    }
}

// -PpekAbi=arm64-v8a | armeabi-v7a (set by the workflow, one build per CPU type)
def pekAbi = project.findProperty('pekAbi')
def pekBaseCode = 25

android {
    namespace 'com.pektv.app'
    compileSdk 36
    ndkVersion '28.2.13676358'

    // The Discord Social SDK's .aar ships its C++ headers as a Prefab package (DISCORD.md). Harmless when the .aar is not there.
    buildFeatures {
        prefab true
    }

    defaultConfig {
        applicationId 'com.pektv.app'
        minSdk 26
        // 36 = Android 16, the level Google Play requires for new apps and
        // updates from Aug 31, 2026.
        targetSdk 36
        // bump pekBaseCode by 1 for every release you publish. Each CPU build gets its own versionCode (an install must
        // never replace a 64-bit build with a 32-bit one or the reverse): 18 -> 181 (32-bit) and 182 (64-bit).
        versionCode pekBaseCode * 10 + (pekAbi == 'arm64-v8a' ? 2 : (pekAbi == 'armeabi-v7a' ? 1 : 0))
        // CI passes -PpekVersionName=<tag>; local builds use 2.2.5
        versionName (project.hasProperty('pekVersionName') ? project.property('pekVersionName') : '2.2.5')

        // Chaquopy refuses to configure without ndk.abiFilters, and Gradle refuses abiFilters together with the
        // `splits { abi }` block, so there are no splits: the workflow builds once per CPU with -PpekAbi=<abi>
        // and every build holds exactly one CPU type (still no fat APK). No -PpekAbi (a local build) = both.
        ndk {
            abiFilters.addAll(pekAbi ? [pekAbi] : ['arm64-v8a', 'armeabi-v7a'])
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                // -PpekTorrent=true or the older -PhesperTorrent=true (still accepted) builds in torrent streaming.
                arguments "-DPEK_TORRENT=${((project.hasProperty('pekTorrent') && project.property('pekTorrent') == 'true') || (project.hasProperty('hesperTorrent') && project.property('hesperTorrent') == 'true')) ? 'ON' : 'OFF'}"
            }
        }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }

    // Release signing: CI supplies these as environment variables (from GitHub secrets).
    // With none set (e.g. a local assembleRelease) the release build is signed with the
    // debug key so it still installs - never publish one of those.
    def pekKs = System.getenv('PEK_KEYSTORE_FILE')
    signingConfigs {
        if (pekKs) {
            release {
                storeFile file(pekKs)
                storePassword System.getenv('PEK_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PEK_KEY_ALIAS')
                keyPassword System.getenv('PEK_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // Installs NEXT TO the beta (different app id) so you can keep both.
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            debuggable true
        }
        release {
            debuggable false
            // R8 off for the first beta: the JNI bridge and Chaquopy are easy to break with shrinking.
            minifyEnabled false
            shrinkResources false
            signingConfig pekKs ? signingConfigs.release : signingConfigs.debug
            if (!pekKs) logger.warn('WARNING: PEK_KEYSTORE_FILE not set - release signed with DEBUG key')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // libmpv-release.aar, the Discord SDK and Flutter each bring their own libc++_shared.so; keep one copy instead of failing the merge.
    packaging {
        jniLibs {
            pickFirsts += ['**/libc++_shared.so']
        }
    }
}

// Chaquopy: embedded Python so plugins/<name>/backend.py runs on Android.
// 3.11 is the newest Python that still ships 32-bit (armeabi-v7a) builds.
chaquopy {
    defaultConfig {
        version = "3.11"
    }
}

// pek_guard.py has ONE source of truth now: backend/pek_guard.py (the same file the
// C++/Termux build loads, see backend/core.cpp). It used to be hand-copied into this Python
// source set and the two drifted apart; this task copies the real file in before every build
// instead, so there is nothing left to keep in sync by hand. The copy lands in
// src/main/python/pek_guard.py, which is .gitignore'd (see android/.gitignore) so no one
// commits a second copy by accident.
tasks.register('copyPekGuard', Copy) {
    from new File(rootDir, '../backend/pek_guard.py')
    from new File(rootDir, '../backend/pek_ed25519.py')   // the signature check pek_guard.py uses for official plugins
    into 'src/main/python'
    // The pinned official signing keys (backend/pek_official_keys.txt) as a module the guard imports. Generated here so the
    // .txt stays the one place to edit and nothing reads a data file out of the APK at run time.
    doLast {
        def keys = new File(rootDir, '../backend/pek_official_keys.txt').readLines()
            .collect { it.replaceFirst(/#.*$/, '').trim() }.findAll { it ==~ /[0-9a-fA-F]{64}/ }
        new File(projectDir, 'src/main/python/pek_official_keys.py').text =
            '# generated by app/build.gradle from backend/pek_official_keys.txt - do not edit or commit\nKEYS = ' +
            '[' + keys.collect { "'" + it + "'" }.join(', ') + ']\n'
    }
}
preBuild.dependsOn copyPekGuard
// Gradle 8.14 validates that any task reading src/main/python declares the task that writes it.
// Chaquopy's merge<Variant>PythonSources reads that folder, so it must run after the copy.
tasks.matching { it.name ==~ /merge.*PythonSources/ }.configureEach {
    dependsOn 'copyPekGuard'
}

// Branding artwork (launcher icon, TV banner, splash videos) lives in the repo's top-level assets/ folder.
android.sourceSets.main.res.srcDir new File(rootDir, '../assets/android/res')

// Voice search: the speech-to-text model (Moonshine tiny int8) lives in the repo's top-level assets/bundled/voice/stt/ (shared by
// all platforms, fetched by tools/fetch-voice-model.sh) and is added to the APK's assets/ as voice/stt/*.
// .onnx stays uncompressed in the APK (it barely shrinks, and this makes install and the first-run copy faster).
android.sourceSets.main.assets.srcDir new File(rootDir, '../assets/bundled')
android.androidResources { noCompress 'onnx' }
if (!new File(rootDir, '../assets/bundled/voice/stt/encode.int8.onnx').exists()) {
    logger.warn('WARNING: voice model not bundled - run tools/fetch-voice-model.sh. Voice search will say the model is missing.')
}

// Flutter UI: only wired in when the module has been generated (see settings.gradle).
def flutterOn = new File(rootDir, '../flutter_ui/.android/include_flutter.groovy').exists()
if (flutterOn) {
    android.sourceSets.main.java.srcDir 'src/flutter/java'
}

dependencies {
    if (flutterOn) {
        implementation project(':flutter')
    }
    // mpv engine: the app's only video player (decoding + rendering).
    // android/app/libs/libmpv-release.aar is a libmpv build WITH DVD support (libdvdnav + libdvdread + libdvdcss): it opens
    // dvd:// discs, VIDEO_TS folders and .iso files (DVD.md). It has the same dev.jdtech.mpv.MPVLib API as the Maven build, so
    // nothing else changes. Without that file (a checkout that does not have it) the plain Maven build is used - no DVD playback.
    if (file('libs/libmpv-release.aar').exists()) {
        implementation files('libs/libmpv-release.aar')
    } else {
        implementation 'dev.jdtech.mpv:libmpv:1.0.0'
    }
    // Discord Rich Presence (DISCORD.md): the Discord Social SDK's .aar is committed in android/app/libs/, so CI builds include it.
    // The guard only keeps a checkout that is missing the file building (without Discord support).
    if (file('libs/discord_partner_sdk.aar').exists()) {
        implementation files('libs/discord_partner_sdk.aar')
    }
}
