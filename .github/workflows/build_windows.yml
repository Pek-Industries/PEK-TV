name: Build PEK TV (Windows)

# Tag push  (v0.1.3)  -> signed RELEASE zips + attached to the GitHub release (next to the Android apks)
# Manual run (Actions tab / gh) -> pick debug or release, optional publish
#
# Per CPU type (like the Android workflow's two apks) a SETUP PROGRAM (the file to hand out) and a portable zip:
#   PEK-TV-<version>-windows-x64-setup.exe     + PEK-TV-<version>-windows-x64.zip     64-bit Intel / AMD   (normal PCs)
#   PEK-TV-<version>-windows-arm64-setup.exe   + PEK-TV-<version>-windows-arm64.zip   64-bit ARM           (Snapdragon / Copilot+ PCs)
# There is NO 32-bit (x86) zip: Flutter cannot build 32-bit Windows apps at all (its Windows engine exists for x64 and ARM64 only),
# so the Windows split is x64 / ARM64 instead of Android's arm64-v8a / armeabi-v7a. See WINDOWS.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 'debug = fast, unsigned official plugins | release = signed plugins (needs PEK_PLUGIN_SIGNING_KEY)'
        type: choice
        options: [debug, release]
        default: debug
      torrent:
        description: 'Build in torrent streaming (libtorrent) - needed for stream playback'
        type: boolean
        default: true
      publish:
        description: 'Release builds only: also publish a GitHub release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            msystem: CLANG64
            mpv: x86_64
            ffmpeg: win64
            python: amd64
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            mpv: aarch64
            ffmpeg: winarm64
            python: arm64
    defaults:
      run:
        shell: bash
    env:
      BUILD_TYPE: ${{ github.event_name == 'push' && 'release' || inputs.build_type }}
      WANT_TORRENT: ${{ github.event_name == 'workflow_dispatch' && inputs.torrent || github.event_name == 'push' && 'true' || 'false' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ---- Version (same checks as the Android build) -------------------------
      - name: Check release numbers agree
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            python tools/check_version.py --tag "${GITHUB_REF_NAME}"
          else
            python tools/check_version.py
          fi

      - name: Signing tests
        run: python tools/test_signing.py

      - name: Translation check
        run: python tools/check_l10n.py

      - name: Work out version name
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(grep -oP "versionName.*: '\K[^']+" android/app/build.gradle)-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "Version: $V  (type: $BUILD_TYPE, ${{ matrix.arch }})"

      # ---- The C++ server as pek_server.dll (MSYS2 clang, the compiler family the Android NDK uses) ----
      - name: Set up MSYS2 (${{ matrix.msystem }})
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            openssl:p
            sqlite3:p
            libtorrent-rasterbar:p
            boost:p
            zlib:p
            pkgconf:p
          # make + diffutils: only for scripts/build-ffprobe.sh (the minimal ffprobe)
          install: >-
            make
            diffutils

      # SMB (libsmb2) and NFS (libnfs): cloned like the Android workflow does. A failed clone only means that protocol is left out.
      - name: Clone libsmb2 (SMB shares)
        continue-on-error: true
        run: git clone --depth 1 https://github.com/sahlberg/libsmb2 windows/libsmb2

      - name: Clone libnfs (NFS shares)
        continue-on-error: true
        run: git clone --depth 1 https://github.com/sahlberg/libnfs windows/libnfs

      - name: Build pek_server.dll
        shell: msys2 {0}
        run: |
          T=""
          [ "$WANT_TORRENT" = true ] && T="-DPEK_TORRENT=ON"
          build() { rm -rf build/backend; cmake -S windows/backend -B build/backend -G Ninja -DCMAKE_BUILD_TYPE=Release $T && cmake --build build/backend -- -k 0; }   # -k 0: keep going after an error, so one log shows every failing file
          # An optional library is "stashed" (moved out of windows/) to leave it out: CMake builds in only the folders that exist.
          mkdir -p .pek-optional
          stash()   { [ -d "windows/$1" ] && mv "windows/$1" ".pek-optional/$1"; return 0; }
          unstash() { [ -d ".pek-optional/$1" ] && mv ".pek-optional/$1" "windows/$1"; return 0; }
          diag() {   # what libsmb2 looks like, so a failed build can be fixed from this log alone. Never fails the step.
            set +e
            echo "::group::libsmb2 diagnostics"
            if [ -d windows/libsmb2 ]; then
              echo "--- libsmb2.h: t_socket"; grep -n -B8 -A3 "t_socket" windows/libsmb2/include/smb2/libsmb2.h | head -60
              echo "--- lib/compat.h (top)"; sed -n 1,80p windows/libsmb2/lib/compat.h
              echo "--- where the missing names appear"
              grep -rn "smb2_random\|smb2_srandom\|getpid_num\|login_num\|NEED_RANDOM\|NEED_GETPID\|NEED_GETLOGIN" windows/libsmb2 --include=*.h --include=*.c --include=CMakeLists.txt | head -50
            fi
            echo "::endgroup::"
            set -e
            return 0
          }
          # Full build first. If it fails, find out which optional library is the problem by trying each on its own (so one broken
          # library does not hide whether the other works), and finally neither. Torrents are never dropped silently.
          if build; then :
          else
            echo "::warning::Server build failed with SMB + NFS - trying NFS alone, then SMB alone"
            diag
            stash libsmb2
            if build; then :
            else
              unstash libsmb2; stash libnfs
              if build; then :
              else
                echo "::warning::Neither SMB nor NFS built - building the server without them"
                stash libsmb2; stash libnfs
                if ! build; then
                  if [ "$WANT_TORRENT" = true ]; then
                    echo "::error::The server did not build with torrent support. Not falling back silently: that would ship an app that cannot play torrents."
                  fi
                  exit 1
                fi
              fi
            fi
          fi
          [ -d windows/libsmb2 ] && echo "SMB: built in" || echo "::warning::SMB: NOT built in this server"
          [ -d windows/libnfs ]  && echo "NFS: built in" || echo "::warning::NFS: NOT built in this server"
          ls -l build/backend/pek_server.dll

      # The DLLs pek_server.dll needs at run time (libtorrent, OpenSSL ...). Not shipping them = the app can not load the server.
      - name: Collect server DLL dependencies
        shell: msys2 {0}
        run: bash windows/scripts/collect-server-deps.sh

      # ---- Things that ship next to the exe -------------------------------------
      - name: Fetch libmpv
        run: bash windows/scripts/fetch-libmpv.sh ${{ matrix.mpv }}

      # A minimal ffprobe (demuxers + parsers only, a few MB) built from the FFmpeg sources: the scanner only needs `-show_format`.
      # It replaces the 136 MB (x64) / 84 MB (ARM64) full static ffprobe. If it does not build or fails its check, the full ffprobe
      # below is used instead, so a problem here can never stop a release.
      - name: Build minimal ffprobe
        shell: msys2 {0}
        run: bash windows/scripts/build-ffprobe.sh ${{ matrix.arch }} || echo "::warning::The minimal ffprobe did not build - the full ffprobe is used instead"

      - name: Check minimal ffprobe
        run: |
          if [ -f windows/ffmpeg-min/ffprobe.exe ] && python windows/scripts/test-ffprobe.py windows/ffmpeg-min/ffprobe.exe; then
            mkdir -p windows/ffmpeg
            cp windows/ffmpeg-min/ffprobe.exe windows/ffmpeg/ffprobe.exe
            echo "Using the MINIMAL ffprobe:"; ls -l windows/ffmpeg/ffprobe.exe
          else
            echo "::warning::The minimal ffprobe is missing or failed its check - falling back to the full ffprobe download"
          fi

      - name: Fetch ffprobe (only if the minimal one is not in place)
        run: bash windows/scripts/fetch-ffprobe.sh ${{ matrix.ffmpeg }}

      - name: Fetch embeddable Python
        run: bash windows/scripts/fetch-python.sh ${{ matrix.python }}

      - name: Cache voice model (bundled speech to text)
        uses: actions/cache@v4
        with:
          path: assets/bundled/voice
          key: voice-stt-${{ hashFiles('tools/fetch-voice-model.sh') }}

      - name: Ensure voice model
        run: bash tools/fetch-voice-model.sh

      - name: Stage app files
        env:
          PEK_PLUGIN_SIGNING_KEY: ${{ secrets.PEK_PLUGIN_SIGNING_KEY }}
          PEK_ARCH: ${{ matrix.arch }}   # which windows/discord/<arch>/ DLL to ship
        run: bash windows/scripts/stage-assets.sh "$VERSION_NAME"

      # ---- Flutter ---------------------------------------------------------------
      - name: Set up Flutter (x64)
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Same pin as the Android workflow: raise both together.
          flutter-version: '3.47.9'
          architecture: x64
          cache: true

      # Flutter publishes no Windows ARM64 SDK archive, so flutter-action cannot install one. An x64 SDK running
      # under emulation builds x64 apps (the first ARM64 run proved it), so for ARM64 the SDK comes straight from git
      # and runs natively on the ARM64 runner, which makes `flutter build windows` target ARM64.
      - name: Set up Flutter (ARM64, from git)
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics >/dev/null 2>&1 || true
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Prepare the Windows project (build/windows_app)
        run: bash windows/scripts/prepare-flutter-host.sh

      - name: flutter pub get
        working-directory: build/windows_app
        run: flutter pub get

      - name: Build Windows app
        working-directory: build/windows_app
        run: flutter build windows --release   # no --target-platform on Windows: the tool builds for the machine it runs on (x64 job -> x64, ARM64 job -> ARM64)

      - name: Install Inno Setup (builds the installer)
        run: |
          have() { command -v iscc >/dev/null || [ -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] || [ -x "/c/Program Files/Inno Setup 6/ISCC.exe" ] || [ -x "$LOCALAPPDATA/Programs/Inno Setup 6/ISCC.exe" ]; }
          have || choco install innosetup -y --no-progress || echo "::warning::Could not install Inno Setup"

      - name: Package (installer + zip)
        env:
          # The ARM64 runner may not have a way to install Inno Setup: its installer is then skipped with a warning, not a failure.
          PEK_INSTALLER_OPTIONAL: ${{ matrix.arch == 'arm64' && '1' || '0' }}
        run: bash windows/scripts/package.sh ${{ matrix.arch }} "$VERSION_NAME" "$BUILD_TYPE"

      # Two SEPARATE artifacts, so the installer and the portable zip are never downloaded together in one zip.
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PEK-TV-${{ env.VERSION_NAME }}-${{ env.BUILD_TYPE }}-windows-${{ matrix.arch }}-installer
          path: dist/*-setup.exe
          if-no-files-found: warn   # the ARM64 installer is optional (see PEK_INSTALLER_OPTIONAL)
          retention-days: 30

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: PEK-TV-${{ env.VERSION_NAME }}-${{ env.BUILD_TYPE }}-windows-${{ matrix.arch }}-portable
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  # One publish step after BOTH zips exist (two jobs creating the same release at once would race).
  publish:
    needs: build
    runs-on: ubuntu-24.04
    if: ${{ (github.event_name == 'push' || inputs.publish) && (github.event_name == 'push' || inputs.build_type == 'release') }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out version name
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(grep -oP "versionName.*: '\K[^']+" android/app/build.gradle)-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: PEK-TV-*-windows-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', env.VERSION_NAME) }}
          name: PEK TV ${{ env.VERSION_NAME }}
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.exe
