# Only needed if you deploy with wrangler (npx wrangler deploy). The dashboard route in SETUP.md does not use this file.
name = "pek-plugins"
main = "worker.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "pek-plugins"
database_id = "PASTE-THE-D1-DATABASE-ID-HERE"

[[r2_buckets]]
binding = "PLUGINS"
bucket_name = "pek-plugins-files"

[vars]
SITE_URL = "https://pekindustries.com/pektv/"
OWNER_GITHUB = "YOUR-GITHUB-USERNAME"
# GITHUB_CLIENT_ID is a plain variable; GITHUB_CLIENT_SECRET must be a secret: npx wrangler secret put GITHUB_CLIENT_SECRET
GITHUB_CLIENT_ID = "PASTE-CLIENT-ID"
